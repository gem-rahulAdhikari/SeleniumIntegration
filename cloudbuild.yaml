steps:
- name: 'gcr.io/cloud-builders/gcloud'
  args:
  - compute
  - ssh
  - --zone=asia-south2-c
  - g-editor
  - --project=g-codeeditor
  - name: 'gcr.io/cloud-builders/gcloud'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        /home/gemcodeeditor/script.sh 'param1'
options:
  logging: CLOUD_LOGGING_ONLY
