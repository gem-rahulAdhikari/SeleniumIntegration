name: Run Selenium Tests

on:
  push:
    branches:
      - 1704714149  # Change this to your default branch if different
    paths:
      - 'src/main/java/App.java'

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Start Selenium Server
        run: |
          docker run -d -p 4444:4444 --name selenium-chrome selenium/standalone-chrome:latest

      - name: Build and run Selenium tests
        run: |
          mkdir test-output
          FILE_NAME=reportName.properties

          getProperty() {
            prop_key=$1
            prop_value=$(cat ${FILE_NAME} | grep ${prop_key} | cut -d'=' -f2)
          }
          getProperty reportName
          cd test-output
          > ${prop_value}.txt
          cd ..
          mvn test -DsuiteXmlFile=testng.xml >> ./test-output/${prop_value}.txt
        shell: bash

      - name: list files
        if: always()
        run: |
          ls
          echo
          echo "ls test-output"
          cd test-output
          ls

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v2
        with:
          name: test-output
          path: test-output

      - name: Download test report
        if: always()
        uses: actions/download-artifact@v2
        with:
          name: test-output

      - name: Check for compile errors and upload report
        if: always()
        run: |
          javac -cp .:resources/* compileExceptionsUploader.java
          java -cp .:resources/* compileExceptionsUploader
