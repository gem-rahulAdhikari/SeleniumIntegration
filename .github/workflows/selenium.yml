name: Run Selenium Tests

on:
  push:
    branches:
      - 1705568491  # Change this to your default branch if different
    paths:
      - 'src/main/java/App.java'

jobs:
  run_tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Start Selenium Server
        run: |
          docker run -d -p 4444:4444 --name selenium-chrome selenium/standalone-chrome:latest

      - name: Build and run Selenium tests
        run: |
        mvn clean compile
          # mvn test -DsuiteXmlFile=testng.xml
          # mvn test -DsuiteXmlFile=testng.xml >> ./test-output/${prop_value}.txt
        shell: bash
